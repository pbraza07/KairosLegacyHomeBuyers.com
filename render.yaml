services:
  - type: web
    name: kairos-legacy-homes
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: kairos-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: NOTIFICATION_EMAIL
        value: kairoslegacyhomes@gmail.com

databases:
  - name: kairos-postgres
    region: virginia
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: kairos
    user: kairos
    diskSizeGB: 5
    ipAllowList: []

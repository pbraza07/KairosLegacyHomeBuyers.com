services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: kairos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - kairos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kairos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kairos_pg:
